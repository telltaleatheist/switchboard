# electron-builder configuration for Switchboard.
#
# Driven from the repo root: `npm run package:win-x64` / `npm run package:mac`.
# Both scripts run `npm run build` and `scripts/prepare-server-runtime.js`
# first; this file only describes what goes where.
#
# Layout produced (Windows dir target shown; mac is the same inside the .app):
#
#   Switchboard.exe                       <- Electron, also the server's "node"
#   resources/app.asar
#     app/dist/**                         <- Electron main + preload
#     ui/dist/ui/browser/**               <- Angular console (asar is fine)
#     package.json                        <- "main": app/dist/main.js
#   resources/server/                     <- extraResources, OUTSIDE the asar
#     dist/**                             <- server/dist, unchanged
#     node_modules/**                     <- better-sqlite3 + ws, built for
#                                            Electron's Node ABI
#
# The server lives outside the asar because native .node files cannot be
# loaded from an asar archive; app/src/paths.ts resolves it via
# process.resourcesPath when app.isPackaged.

appId: com.switchboard.app
productName: Switchboard
copyright: Copyright © 2026 Owen Morgan

directories:
  # The repo root IS the app package (its package.json carries "main":
  # app/dist/main.js). Without this, electron-builder auto-detects the `app/`
  # sub-directory as the app package and packs the wrong tree.
  app: .
  output: release
  buildResources: build-resources

# The asar payload. Paths are relative to the project root, which is also the
# app directory (the root package.json is the app's package.json).
files:
  - package.json
  - app/dist/**/*
  - ui/dist/ui/browser/**/*

extraResources:
  - from: staging/server-runtime
    to: server
  # Separate entry on purpose: electron-builder's file copier skips any
  # directory *named* node_modules while walking a source tree, so the
  # server's dependencies have to be handed to it as their own root.
  - from: staging/server-runtime/node_modules
    to: server/node_modules

asar: true

# Switchboard ships no update feed. This must be an explicit null: with it
# unset, electron-builder auto-detects a publish provider from any GH_TOKEN /
# GITHUB_TOKEN / GITLAB_TOKEN in the environment, fails to resolve a repo for
# it, and then crashes building latest.yml with
# "Cannot read properties of null (reading 'channel')".
publish: null

# Nothing native is a dependency of the *app* package: the only native module
# (better-sqlite3) belongs to the server runtime, which is staged and rebuilt
# for Electron's ABI by scripts/prepare-server-runtime.js before packaging.
npmRebuild: false

win:
  # Two artifacts from one run:
  #   dir  -> release/win-unpacked, the runnable tree scripts/verify-packaged.mjs
  #           checks (it must keep existing — do not drop this target).
  #   nsis -> release/Switchboard-Setup-<version>.exe, the friendly installer.
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  # No code signing in v1: no certificate is configured, and nothing here may
  # ask for one. electron-builder skips signing when no certificate is given.

nsis:
  # An assisted installer (wizard), not a silent one-click install.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user install: no UAC elevation prompt, no admin rights required.
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Switchboard
  menuCategory: false
  deleteAppDataOnUninstall: false
  # Differential/blockmap output is only useful with an update feed; skip it so
  # release/ holds just the installer.
  differentialPackage: false
  artifactName: Switchboard-Setup-${version}.exe

mac:
  # Host architecture only, deliberately: the staged server carries ONE
  # compiled better-sqlite3 binary (built for the machine doing the packaging),
  # so a universal/cross-arch dmg would ship a native module for the wrong
  # arch. Build the arm64 dmg on an arm64 Mac, the x64 dmg on an x64 Mac.
  target:
    - dmg
  category: public.app-category.developer-tools
  # No code signing / notarization in v1.
  identity: null
